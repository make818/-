<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Su Chess · 素棋试玩</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#39443d,#141817 70%);color:#f5ead2;font:15px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1080px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px}.brand h1{margin:0;font-size:clamp(26px,5vw,48px);letter-spacing:2px}.brand p{margin:5px 0;color:#c9bda3}.layout{display:grid;grid-template-columns:minmax(300px,700px) 260px;gap:20px;align-items:start;margin-top:18px}.board{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;padding:10px;background:linear-gradient(145deg,#b8874a,#4e301d 65%,#24170f);border-radius:14px;box-shadow:0 18px 45px #0009,inset 0 1px #f6d99a}.cell{position:relative;display:grid;place-items:center;cursor:pointer;user-select:none}.light{background:linear-gradient(145deg,#eee2c6,#c7b691)}.dark{background:linear-gradient(145deg,#4b524b,#272d29)}.portal{background:radial-gradient(circle,#d3ae70,#8a6338)!important}.cell:after{content:'';position:absolute;inset:0;border:1px solid #0001}.cell.selected{outline:4px solid #f0b84d;z-index:2}.cell.target:before{content:'';width:26%;height:26%;border-radius:50%;background:#6dd3a4cc;box-shadow:0 0 12px #6dd3a4;position:absolute}.piece{width:70%;height:70%;border-radius:50%;display:grid;place-items:center;position:relative;color:#fff8e8;font-weight:800;font-size:clamp(10px,2.4vw,21px);text-shadow:0 2px 2px #000;box-shadow:inset 4px 4px 5px #ffffff55,inset -6px -7px 9px #0008,0 5px 5px #0009;transform:translateY(-3px);border:2px solid #fff5}.piece:after{content:'';position:absolute;inset:8%;border-radius:50%;border:1px solid #ffffff44}.white{background:linear-gradient(145deg,#faf0d1,#b8753c 65%,#5a2f1e)}.black{background:linear-gradient(145deg,#77837a,#263b34 65%,#101713)}.piece.cannon{border-radius:28% 28% 45% 45%;font-size:clamp(9px,2vw,16px)}.piece.bishop{border-radius:45% 45% 35% 35%}.piece.rook{border-radius:15%;}.piece.shield{border-radius:45% 45% 52% 52%;clip-path:polygon(50% 0,92% 20%,82% 78%,50% 100%,18% 78%,8% 20%)}.piece.pawn{border-radius:50% 50% 38% 38%}.piece.knight{border-radius:48% 18% 48% 38%}.piece.king{border-radius:48% 48% 30% 30%;font-size:clamp(12px,3vw,24px)}.panel{background:linear-gradient(145deg,#2b332e,#1b211e);border:1px solid #ffffff18;border-radius:12px;padding:15px;box-shadow:0 8px 20px #0005}.panel h2{font-size:17px;margin:0 0 10px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button{border:0;border-radius:7px;padding:10px 12px;font-weight:700;cursor:pointer;color:#241b10;background:linear-gradient(#f5d486,#bf8038);box-shadow:0 3px #70431e}button:active{transform:translateY(2px);box-shadow:0 1px #70431e}.status{font-size:15px;line-height:1.6}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;color:#d5c7ab;font-size:13px}.log{max-height:190px;overflow:auto;color:#cfc3a9;font-size:12px;line-height:1.5}.notice{margin-top:15px;color:#e5c886;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:-1}}
</style>
<style>
/* Sculpted, chess-like silhouettes: every type has its own profile; no emoji are used. */
.piece{box-shadow:inset 4px 4px 6px #ffffff55,inset -7px -8px 10px #0009,0 6px 5px #000a;transition:transform .12s,filter .12s}
.piece:hover{transform:translateY(-6px);filter:brightness(1.14)}
.piece:before{content:'';position:absolute;left:7%;right:7%;bottom:-10%;height:20%;border-radius:50%;background:#0008;box-shadow:0 1px 2px #fff4}
.piece.cannon{width:64%;height:66%;border-radius:30% 30% 42% 42%;transform:translateY(-5px)}
.piece.cannon:before{left:-9%;right:-9%;bottom:-13%;height:25%;border-radius:45%}
.piece.bishop{width:58%;height:76%;border-radius:48% 48% 32% 32%;clip-path:polygon(50% 0,74% 25%,68% 40%,82% 100%,18% 100%,32% 40%,26% 25%)}
.piece.rook{border-radius:12%;width:66%;height:70%;clip-path:polygon(8% 0,30% 0,30% 12%,50% 12%,50% 0,72% 0,72% 12%,92% 12%,84% 100%,16% 100%)}
.piece.shield{clip-path:polygon(50% 0,92% 20%,82% 78%,50% 100%,18% 78%,8% 20%)}
.piece.pawn{width:55%;height:62%;border-radius:50% 50% 38% 38%}
.piece.knight{width:62%;height:72%;border-radius:48% 18% 48% 38%;clip-path:polygon(15% 100%,20% 55%,6% 30%,38% 34%,50% 5%,72% 22%,94% 18%,82% 55%,92% 100%)}
.piece.king{width:64%;height:78%;border-radius:48% 48% 30% 30%;clip-path:polygon(12% 100%,20% 34%,35% 34%,35% 12%,50% 25%,65% 12%,65% 34%,80% 34%,88% 100%)}
</style>
<main><div class="top"><div class="brand"><h1>SU CHESS <small>素棋</small></h1><p>立体棋子 · 隐藏三王 · 传送门 · 实验试玩版</p></div></div><div class="buttons"><button id="new">新局</button><button id="ai">AI 走一步</button><button id="copy">复制邀请链接</button></div><div class="layout"><div id="board" class="board"></div><aside class="side"><div class="panel"><h2 id="status">准备开始</h2><div class="legend"><span>盾 Shield</span><span>象 Bishop</span><span>车 Rook</span><span>兵 Pawn</span><span>炮 Cannon</span><span>王 King</span><span>马 Knight</span></div><div class="notice">棋子身份在网页试玩中保持隐藏。完整规则引擎和测试请见 GitHub 仓库。</div></div><div class="panel" style="margin-top:14px"><h2>对局记录</h2><div id="log" class="log">新局已开始</div></div></aside></div></main>
<script>
const N=10,portal=new Set(['4,4','4,5','5,4','5,5']);let b,turn,sel,over,history=[];
const label={shield:'盾',bishop:'象',rook:'车',pawn:'兵',cannon:'炮',king:'王',knight:'马'};
function setup(){b=Array.from({length:10},()=>Array(10).fill(null));let order=[['shield',3],['bishop',1],['rook',1],['pawn',5],['cannon',3],['king',3],['knight',3]];for(const side of [0,1]){let a=[];for(const [k,n] of order)for(let i=0;i<n;i++)a.push({s:side,k});for(let i=0;i<a.length;i++){let row=side?8-Math.floor(i/10):1+Math.floor(i/10),col=side?9-i%10:i%10;b[row][col]=a[i]}}turn=0;sel=null;over=false;history=['新局开始'];draw()}
function inside(r,c){return r>=0&&r<10&&c>=0&&c<10&&!portal.has(r+','+c)}
function moves(r,c){let p=b[r][c],out=[];if(!p)return out;let ds=[];if(p.k==='knight')ds=[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]];else if(['king','shield'].includes(p.k))ds=[...Array(3)].flatMap((_,a)=>[...Array(3)].map((_,d)=>[a-1,d-1])).filter(x=>x[0]||x[1]);else if(p.k==='pawn')ds=[[1,1],[1,-1],[-1,1],[-1,-1]];else if(['rook','cannon'].includes(p.k))ds=[[1,0],[-1,0],[0,1],[0,-1]];else ds=[[1,1],[1,-1],[-1,1],[-1,-1]];if(['rook','bishop','cannon'].includes(p.k)){for(const d of ds)for(let n=1;n<10;n++){let q=[r+d[0]*n,c+d[1]*n];if(!inside(...q))break;if(!b[q[0]][q[1]])out.push(q);else{if(b[q[0]][q[1]].s!==p.s)out.push(q);break}}}else for(const d of ds){let q=[r+d[0],c+d[1]];if(inside(...q)&&(!b[q[0]][q[1]]||b[q[0]][q[1]].s!==p.s))out.push(q)}return out}
function move(r,c){if(over)return;let p=b[r][c];if(sel){let ok=moves(...sel).some(q=>q[0]===r&&q[1]===c);if(ok){let a=b[sel[0]][sel[1]],t=b[r][c];b[r][c]=a;b[sel[0]][sel[1]]=null;history.push(`${turn?'AI':'你'}：${label[a.k]} ${sel.join(',')} → ${r},${c}${t?' 吃子':''}`);turn=1-turn;sel=null;draw();if(turn===1)setTimeout(ai,350)}else{sel=p&&p.s===turn?[r,c]:null;draw()}}else if(p&&p.s===turn){sel=[r,c];draw()}}
function ai(){if(over||turn!==1)return;let all=[];for(let r=0;r<10;r++)for(let c=0;c<10;c++)if(b[r][c]?.s===1)for(const q of moves(r,c))all.push([[r,c],q]);if(!all.length){history.push('AI 无合法走法');over=true;draw();return}let caps=all.filter(x=>b[x[1][0]][x[1][1]]);let x=(caps.length?caps:all)[Math.floor(Math.random()*(caps.length?caps:all).length)],a=x[0],q=x[1],p=b[a[0]][a[1]],t=b[q[0]][q[1]];b[q[0]][q[1]]=p;b[a[0]][a[1]]=null;history.push(`AI：${label[p.k]} ${a.join(',')} → ${q.join(',')}${t?' 吃子':''}`);if(t?.k==='king'){over=true;history.push('试玩结束：AI 吃到王')}turn=0;draw()}
function draw(){let e=document.getElementById('board');e.innerHTML='';for(let r=0;r<10;r++)for(let c=0;c<10;c++){let x=document.createElement('div');x.className='cell '+((r+c)%2?'dark':'light')+(portal.has(r+','+c)?' portal':'')+(sel&&sel[0]===r&&sel[1]===c?' selected':'');if(sel&&moves(...sel).some(q=>q[0]===r&&q[1]===c))x.className+=' target';let p=b[r][c];if(p){let z=document.createElement('div');z.className=`piece ${p.s?'black':'white'} ${p.k}`;z.textContent=label[p.k];z.title=label[p.k];z.setAttribute('aria-label',label[p.k]);x.appendChild(z)}x.setAttribute('aria-label',`${r},${c}`);x.onclick=()=>move(r,c);e.appendChild(x)}document.getElementById('status').textContent=over?'对局结束':`轮到：${turn?'AI（黑方）':'你（白方）'}${sel?' · 已选中，请点击绿色目标':''}`;document.getElementById('log').innerHTML=history.slice(-30).reverse().join('<br>')}
document.getElementById('new').onclick=setup;document.getElementById('ai').onclick=ai;document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(location.href).then(()=>alert('已复制邀请链接：\n'+location.href));setup();
</script></html>
