<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Su Chess 试玩</title>
<style>body{font-family:system-ui;background:#202522;color:#f5f0df;margin:0;padding:20px}main{max-width:900px;margin:auto}h1{margin:0 0 4px}.sub{color:#c9c0a6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{padding:9px 13px;border:0;border-radius:6px;cursor:pointer;background:#d6b36a;color:#241d13;font-weight:600}.board{display:grid;grid-template-columns:repeat(10,1fr);width:min(90vw,700px);aspect-ratio:1;border:8px solid #8d6b42;margin:15px 0}.cell{display:grid;place-items:center;font-size:clamp(16px,4vw,32px);cursor:pointer;user-select:none}.light{background:#e8dfca}.dark{background:#30342f}.sel{outline:4px solid #e85d4a;outline-offset:-4px}.portal{background:#c5a56c!important;box-shadow:inset 0 0 0 3px #6b4c2d}.panel{background:#2d332f;padding:12px;border-radius:8px;line-height:1.5}.warn{color:#ffd17a}</style>
<main><h1>Su Chess 素棋</h1><div class="sub">浏览器实验试玩版 · 与基础算法对弈 · 完整规则见仓库文档</div><div class="toolbar"><button id="new">新局</button><button id="ai">让 AI 走一步</button><button id="copy">复制邀请链接</button></div><div id="status" class="panel"></div><div id="board" class="board"></div><div class="panel"><b>玩法：</b>点击己方棋子，再点击目标格。当前网页是轻量试玩原型；正式规则引擎、隐藏王身份和完整测试位于仓库 Python 版本。</div></main>
<script>
const N=10, portal=new Set(['4,4','4,5','5,4','5,5']);let b=[],turn=0,sel=null,over=false;
const kinds=['盾','象','车','兵','炮','王','马'];const glyph={盾:'🛡️',象:'⛵',车:'🏰',兵:'🔺',炮:'💣',王:'⌛',马:'♞'};
function setup(){b=Array.from({length:N},()=>Array(N).fill(null));let pieces=[];for(const [k,n] of [['盾',3],['象',1],['车',1],['兵',5],['炮',3],['王',3],['马',3]])for(let i=0;i<n;i++)pieces.push({s:0,k});pieces.forEach((p,i)=>b[1+Math.floor(i/10)][i%10]=p);pieces=[];for(const [k,n] of [['盾',3],['象',1],['车',1],['兵',5],['炮',3],['王',3],['马',3]])for(let i=0;i<n;i++)pieces.push({s:1,k});pieces.forEach((p,i)=>b[8-Math.floor(i/10)][9-i%10]=p);turn=0;sel=null;over=false;draw()}
function inside(r,c){return r>=0&&r<10&&c>=0&&c<10&&!portal.has(r+','+c)}
function moves(r,c){let p=b[r][c],out=[];if(!p)return out;let ds=[];if(p.k==='马')ds=[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]];else if(p.k==='王'||p.k==='盾')ds=[...Array(3)].flatMap((_,a)=>[...Array(3)].map((_,d)=>[a-1,d-1])).filter(x=>x[0]||x[1]);else if(p.k==='兵')ds=[[1,1],[1,-1],[-1,1],[-1,-1]];else if(p.k==='车'||p.k==='炮')ds=[[1,0],[-1,0],[0,1],[0,-1]];else ds=[[1,1],[1,-1],[-1,1],[-1,-1]];if(['车','象','炮'].includes(p.k)){for(const d of ds){for(let n=1;n<10;n++){let q=[r+d[0]*n,c+d[1]*n];if(!inside(...q))break;if(!b[q[0]][q[1]])out.push(q);else{if(b[q[0]][q[1]].s!==p.s)out.push(q);break}}}}else for(const d of ds){let q=[r+d[0],c+d[1]];if(inside(...q)&&(!b[q[0]][q[1]]||b[q[0]][q[1]].s!==p.s))out.push(q)}return out}
function click(r,c){if(over)return;let p=b[r][c];if(sel){let ok=moves(...sel).some(q=>q[0]===r&&q[1]===c);if(ok){b[r][c]=b[sel[0]][sel[1]];b[sel[0]][sel[1]]=null;turn=1-turn;sel=null;draw();setTimeout(ai,250)}else sel=p&&p.s===turn?[r,c]:null;draw()}else if(p&&p.s===turn){sel=[r,c];draw()}}
function ai(){if(over||turn!==1)return;let a=[];for(let r=0;r<10;r++)for(let c=0;c<10;c++)if(b[r][c]?.s===1)for(const q of moves(r,c))a.push([[r,c],q]);if(!a.length){over=true;draw();return}let x=a[Math.floor(Math.random()*a.length)],p=b[x[0][0]][x[0][1]],t=b[x[1][0]][x[1][1]];if(t?.k==='王'){over=true;document.getElementById('status').innerHTML='AI 吃到了你的王，试玩结束。';}b[x[1][0]][x[1][1]]=p;b[x[0][0]][x[0][1]]=null;turn=0;draw()}
function draw(){let e=document.getElementById('board');e.innerHTML='';for(let r=0;r<10;r++)for(let c=0;c<10;c++){let x=document.createElement('div');x.className='cell '+((r+c)%2?'dark':'light')+(portal.has(r+','+c)?' portal':'')+(sel&&sel[0]===r&&sel[1]===c?' sel':'');x.textContent=b[r][c]?glyph[b[r][c].k]:'';x.onclick=()=>click(r,c);e.appendChild(x)}document.getElementById('status').innerHTML=over?'对局结束。':`轮到：${turn===0?'你（白方）':'AI（黑方）'}　${sel?'已选中棋子，请选择目标格。':'请选择棋子。'}`}
document.getElementById('new').onclick=setup;document.getElementById('ai').onclick=ai;document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(location.href).then(()=>alert('邀请链接已复制：\n'+location.href));setup();
</script></html>
